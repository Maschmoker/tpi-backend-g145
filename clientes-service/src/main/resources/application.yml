# Configuración común a todos los entornos.
# Ningún secreto se declara aquí: contraseñas y URLs se inyectan por variables de entorno.
spring:
  application:
    name: clientes-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${CLIENTES_DB:clientes_db}
    username: ${CLIENTES_DB_USER:clientes_user}
    password: ${CLIENTES_DB_PASSWORD}   # sin valor por defecto: falla rápido si no está definida
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: clientes-db-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate            # el esquema lo administra Flyway, no Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # URL pública SIEMPRE: debe coincidir con el claim iss del token emitido.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/guarderia}

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8081
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
