# Configuración común a todos los entornos.
spring:
  application:
    name: logistica-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${LOGISTICA_DB:logistica_db}
    username: ${LOGISTICA_DB_USER:logistica_user}
    password: ${LOGISTICA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: logistica-db-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/guarderia}

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8083
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

servicios:
  estadias:
    url: ${ESTADIAS_SERVICE_URL:http://localhost:8082}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    enabled: ${GOOGLE_MAPS_ENABLED:true}
    geocoding:
      base-url: ${GOOGLE_MAPS_GEOCODING_BASE_URL:https://maps.googleapis.com/maps/api/geocode/json}
    distance-matrix:
      base-url: ${GOOGLE_MAPS_DISTANCE_MATRIX_BASE_URL:https://maps.googleapis.com/maps/api/distancematrix/json}
    timeouts:
      connect-timeout-ms: ${GOOGLE_MAPS_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${GOOGLE_MAPS_READ_TIMEOUT_MS:10000}
