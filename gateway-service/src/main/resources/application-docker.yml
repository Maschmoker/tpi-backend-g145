spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: clientes-service
              uri: ${CLIENTES_SERVICE_URL:http://clientes-service:8081}
              predicates:
                - Path=/api/clientes/**
            - id: estadias-service
              uri: ${ESTADIAS_SERVICE_URL:http://estadias-service:8082}
              predicates:
                - Path=/api/estadias/**
            - id: logistica-service
              uri: ${LOGISTICA_SERVICE_URL:http://logistica-service:8083}
              predicates:
                - Path=/api/logistica/**
            - id: clientes-service-api-docs
              uri: ${CLIENTES_SERVICE_URL:http://clientes-service:8081}
              predicates:
                - Path=/v3/api-docs/clientes
              filters:
                - RewritePath=/v3/api-docs/clientes, /v3/api-docs
            - id: estadias-service-api-docs
              uri: ${ESTADIAS_SERVICE_URL:http://estadias-service:8082}
              predicates:
                - Path=/v3/api-docs/estadias
              filters:
                - RewritePath=/v3/api-docs/estadias, /v3/api-docs
            - id: logistica-service-api-docs
              uri: ${LOGISTICA_SERVICE_URL:http://logistica-service:8083}
              predicates:
                - Path=/v3/api-docs/logistica
              filters:
                - RewritePath=/v3/api-docs/logistica, /v3/api-docs
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/guarderia/protocol/openid-connect/certs
