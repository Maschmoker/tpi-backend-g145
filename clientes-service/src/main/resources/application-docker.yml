# Perfil docker: servicio dentro de la red guarderia-net.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${CLIENTES_DB:clientes_db}
    username: ${CLIENTES_DB_USER:clientes_user}
    password: ${CLIENTES_DB_PASSWORD}

  flyway:
    # Tolera que Postgres tarde unos segundos más que el contenedor del servicio.
    connect-retries: 10
    connect-retries-interval: 5

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer público para validar iss; JWKS por hostname interno (Sección 3).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/guarderia}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/guarderia/protocol/openid-connect/certs}
