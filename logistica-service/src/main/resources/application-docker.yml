# Perfil docker: servicio dentro de la red guarderia-net.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${LOGISTICA_DB:logistica_db}
    username: ${LOGISTICA_DB_USER:logistica_user}
    password: ${LOGISTICA_DB_PASSWORD}

  flyway:
    connect-retries: 10
    connect-retries-interval: 5

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/guarderia}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/guarderia/protocol/openid-connect/certs}

servicios:
  estadias:
    url: ${ESTADIAS_SERVICE_URL:http://estadias-service:8082}
