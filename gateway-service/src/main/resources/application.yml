spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: clientes-service
              uri: ${CLIENTES_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/clientes/**
            - id: estadias-service
              uri: ${ESTADIAS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/estadias/**
            - id: logistica-service
              uri: ${LOGISTICA_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/logistica/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/guarderia

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
